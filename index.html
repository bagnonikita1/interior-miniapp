<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Mini App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ПОРТФОЛИО -->
<section class="portfolio">
  <h2 class="section-title">Портфолио</h2>

  <div class="project" onclick="openProject(
    'Квартира для мужчины средних лет',
    project1Images
  )">
    Квартира для мужчины средних лет
  </div>

  <div class="project" onclick="openProject(
    'Квартира L-town',
    project2Images
  )">
    Квартира L-town
  </div>

  <div class="project" onclick="openProject(
    'Коммерческое пространство для кофейни',
    project3Images
  )">
    Коммерческое пространство для кофейни
  </div>
</section>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="top-bar">
    <div id="project-title"></div>
    <button onclick="closeViewer()">×</button>
  </div>

  <img id="viewerImage" src="" alt="project image">

  <div class="nav-arrow left" onclick="prevImage()">‹</div>
  <div class="nav-arrow right" onclick="nextImage()">›</div>

  <div class="image-counter" id="imageCounter">1 / 1</div>
</div>

<!-- ФОРМА ЗАЯВКИ -->
<section class="form-section">
  <h1 class="form-title">Каждый интерьер начинается с диалога.</h1>
  <p class="form-subtitle">
    Заполните короткую форму — и давайте начнем этот разговор.
  </p>

  <select>
    <option>Новостройка</option>
    <option>Вторичка</option>
    <option>Коммерческое помещение</option>
  </select>

  <input type="text" placeholder="Город объекта">
  <input type="number" placeholder="Площадь помещения">
  <input type="tel" placeholder="+7 (___) ___-__-__">
  <input type="text" placeholder="Ваше имя">

  <button class="submit-btn">Оставить заявку</button>
</section>

<script src="script.js"></script>
</body>
</html>
