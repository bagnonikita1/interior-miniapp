<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дизайн интерьеров</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <section id="home" class="screen active">
    <h1>Дизайн интерьеров</h1>
    <p>Квартиры · Дома · Коммерческие пространства</p>

    <button onclick="openPortfolio()">Портфолио</button>
    <button onclick="openServices()">Услуги и цены</button>
    <button class="primary" onclick="openForm()">Оставить заявку</button>
  </section>

  <section id="portfolio" class="screen">
    <h2>Портфолио</h2>

    <div class="projects">
      <div class="project" onclick="openProject(1)">
        <img src="images/p1-1.jpg">
        <h3>Квартира для мужчины</h3>
      </div>

      <div class="project" onclick="openProject(2)">
        <img src="images/p2-1.jpg">
        <h3>Квартира L-town</h3>
      </div>

      <div class="project" onclick="openProject(3)">
        <img src="images/p3-1.jpg">
        <h3>Коммерческое пространство</h3>
      </div>
    </div>

    <button class="back" onclick="goHome()">Назад</button>
  </section>

  <section id="project" class="screen fullscreen">
    <div class="counter" id="counter"></div>

    <div class="project-slider">
      <button class="arrow left" onclick="prevImage()">‹</button>
      <img id="slider-img">
      <button class="arrow right" onclick="nextImage()">›</button>
    </div>

    <button class="close" onclick="openPortfolio()">Закрыть</button>
  </section>

  <section id="services" class="screen">
    <h2>Услуги</h2>

    <div class="tabs">
      <button class="tab active" onclick="showService(2100)">2100 ₽ / м²</button>
      <button class="tab" onclick="showService(2500)">2500 ₽ / м²</button>
    </div>

    <div id="service-2100" class="service active">
      <p>Минимальный набор</p>
    </div>

    <div id="service-2500" class="service">
      <p>Стандартный набор</p>
    </div>

    <button class="back" onclick="goHome()">Назад</button>
  </section>

  <section id="form" class="screen">
    <h2>Заявка</h2>

    <input id="phone" placeholder="Телефон">
    <input id="area" placeholder="Площадь">
    <textarea id="comment" placeholder="Комментарий"></textarea>

    <button class="primary" onclick="sendForm()">Отправить</button>
    <button class="back" onclick="goHome()">Назад</button>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
